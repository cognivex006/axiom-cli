# This repository is canonical on its own and may be checked out inside a
# directory that already contains an unrelated `Cargo.toml`. An empty
# `[workspace]` table keeps it a standalone package instead of letting cargo
# adopt an ancestor manifest it does not own.
[workspace]

[package]
name = "axiom-cli"
version = "0.1.14"
edition = "2021"
rust-version = "1.85"
description = "Axiom ecosystem distribution entrypoint: thin distribution layer over the axiom-graphd installation engine"
license = "UNLICENSED"
publish = false

# Unicode display width is pinned for safe terminal clipping (ADR-0043).
# Packaged binaries still require no external runtime or elevation.
[dependencies]
unicode-width = "=0.2.2"

[target.'cfg(unix)'.dependencies]
# Native ABI definitions avoid hand-written Darwin/Linux layouts and constants.
libc = "=0.2.172"

[[example]]
name = "terminal-ux-probe"
path = "tests/terminal_ux/probe.rs"

[[bin]]
name = "axiom-cli"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = true
strip = true
