name: publish-container

# Publishes the `axiom-cli` container delivery channel to GitHub Container Registry.
#
# Normative rules: `axiom-specs` `contracts/axiom-cli-distribution-contract.md` section 5
# ("Container channel") and `compatibility/platform-matrix.json` (`distribution.container`).
#
# What this workflow guarantees:
#   * buildx builds the finish-first platform list, starting with `linux/amd64`;
#   * `linux/arm64` is built only when it has been explicitly enabled, so an unverified
#     arm64 image is never published as a placeholder;
#   * every published reference is immutable (an exact version plus a commit-derived tag);
#     a floating `latest` tag does not exist here;
#   * the resolved image digest is recorded as a build artifact and in the run summary, so
#     the digest can be written into the platform matrix later without guessing it;
#   * the base images stay pinned by digest inside `containers/Dockerfile`; this workflow
#     never overrides them.
#
# Running the published image is NOT native runtime evidence for any mandatory native
# target. This job certifies no platform and reports no install, queue, guard, watcher,
# path, migration or update evidence for windows-x64, linux-x64, macos-arm64 or macos-x64.

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push to ghcr.io. false builds and records the digest only."
        type: boolean
        default: false
      publish_arm64:
        description: "Also build linux/arm64. Enable only once that leg has been verified."
        type: boolean
        default: false
  push:
    tags:
      - "v*"
      # Owner-selected native-only release; no image is advertised for this tag.
      - "!v0.1.14"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/orchex006/axiom-cli

jobs:
  publish:
    name: build the container channel
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the pinned revision
        uses: actions/checkout@v4

      - name: Resolve the immutable version and revision
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [ -z "$version" ]; then
            echo "VERSION is empty; refusing to publish an unversioned image" >&2
            exit 1
          fi
          case "$version" in
            *latest*)
              echo "VERSION must not be a floating name: $version" >&2
              exit 1
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "created=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Decide the push mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          push="${{ inputs.push }}"
          if [ "${{ github.event_name }}" = "push" ] || [ "$push" = "true" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve the platform list
        id: platforms
        shell: bash
        run: |
          set -euo pipefail
          platforms="linux/amd64"
          if [ "${{ inputs.publish_arm64 }}" = "true" ]; then
            platforms="${platforms},linux/arm64"
          fi
          echo "list=$platforms" >> "$GITHUB_OUTPUT"

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.mode.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/Dockerfile
          platforms: ${{ steps.platforms.outputs.list }}
          push: ${{ steps.mode.outputs.push == 'true' }}
          provenance: true
          sbom: true
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.version.outputs.epoch }}
            AXIOM_VERSION=${{ steps.version.outputs.version }}
            AXIOM_REVISION=${{ github.sha }}
            AXIOM_CREATED=${{ steps.version.outputs.created }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:git-${{ steps.version.outputs.short_sha }}

      - name: Record the image digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PUSHED: ${{ steps.mode.outputs.push }}
          PLATFORMS: ${{ steps.platforms.outputs.list }}
          VERSION: ${{ steps.version.outputs.version }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$DIGEST" ]; then
            echo "buildx produced no digest; nothing can be recorded" >&2
            exit 1
          fi
          {
            echo "image=${{ env.IMAGE }}"
            echo "version=$VERSION"
            echo "revision=$REVISION"
            echo "platforms=$PLATFORMS"
            echo "pushed=$PUSHED"
            echo "digest=$DIGEST"
            echo "immutable_reference=${{ env.IMAGE }}@$DIGEST"
          } | tee "axiom-cli-container-digest.txt"
          {
            echo "## axiom-cli container channel"
            echo ""
            echo "- immutable reference: \`${{ env.IMAGE }}@$DIGEST\`"
            echo "- version: \`$VERSION\`"
            echo "- revision: \`$REVISION\`"
            echo "- platforms: \`$PLATFORMS\`"
            echo "- pushed: \`$PUSHED\`"
            echo ""
            echo "This digest is the value to record in \`compatibility/platform-matrix.json\`"
            echo "(\`distribution.container.published_image_digest\`) once a real publication happens."
            echo "A container run is never native runtime evidence for a native target."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the digest record
        uses: actions/upload-artifact@v4
        with:
          name: axiom-cli-container-digest
          path: axiom-cli-container-digest.txt
          if-no-files-found: error
