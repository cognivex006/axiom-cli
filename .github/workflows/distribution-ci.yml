name: Native distribution CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      owner_ci_inputs:
        description: Explicit JSON vector of successful immutable owner CI runs (candidate only)
        required: false
        default: ''
        type: string
permissions:
  contents: read
jobs:
  dependency-audit:
    name: Terminal dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned audit parser
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 install cargo-deny --version 0.20.2 --locked --root "$RUNNER_TEMP/audit-tools"
      - name: Audit pinned terminal dependencies
        run: |
          "$RUNNER_TEMP/audit-tools/bin/cargo-deny" --locked --config .delivery/dependency-audit.toml check 2>&1 | tee "$RUNNER_TEMP/dependency-audit.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terminal-dependency-audit-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dependency-audit.log
            .delivery/dependency-audit.toml
            Cargo.lock
  native:
    name: native (${{ matrix.platform }})
    outputs:
      composed: ${{ steps.composition-mode.outputs.compose }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2025
          - platform: linux-x64
            os: ubuntu-24.04
          - platform: macos-x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Public documentation and release-note checks
        shell: bash
        run: |
          python release/check_public_docs.py
          python -m unittest tests.test_public_docs tests.test_release_012 -v
          python -m unittest tests.test_windows_runtime_recovery -v
      - name: Required owner Rust checks
        shell: bash
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
          cargo +1.85.0 fmt --check
          cargo +1.85.0 clippy --locked --all-targets -- -D warnings
          cargo +1.85.0 test --locked
          cargo +1.85.0 build --locked --release
      - name: Managed host adapter lifecycle and preservation
        shell: bash
        run: |
          exe=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            exe=".exe"
          fi
          python tests/host_onboarding.py --cli "target/release/axiom-cli${exe}" --out "${RUNNER_TEMP}/host-adapter.json"
      - name: Install pinned native visual capture dependencies
        shell: bash
        run: python -m pip install -r tests/terminal_ux/requirements.txt
      - name: Live download progress and machine output isolation
        shell: bash
        run: |
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=".exe"; fi
          python tests/progress_interaction.py --cli "target/release/axiom-cli${exe}" --out "${RUNNER_TEMP}/progress-proof.json"
      - name: Install and update progress parity and verified bootstrap worker
        shell: python
        run: |
          import os, subprocess, sys
          subprocess.run([sys.executable, 'tests/progress_parity.py', '--out', os.path.join(os.environ['RUNNER_TEMP'], 'progress-parity.json')], check=True)
      - name: Native Windows bootstrap byte progress
        if: runner.os == 'Windows'
        shell: python
        run: |
          import os, subprocess, sys
          subprocess.run([sys.executable, 'tests/progress_powershell.py', '--out', os.path.join(os.environ['RUNNER_TEMP'], 'bootstrap-progress.json')], check=True)
      - name: Native terminal frames, resize, cancellation and modes
        shell: bash
        run: |
          cargo +1.85.0 build --locked --example terminal-ux-probe
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=".exe"; fi
          python tests/terminal_ux/verify.py --probe "target/debug/examples/terminal-ux-probe${exe}" --out "${RUNNER_TEMP}/terminal-visual.json"
      - name: Native POSIX generated curl and wget visual matrix
        if: runner.os != 'Windows'
        shell: bash
        run: python tests/progress_shell.py --out "${RUNNER_TEMP}/shell-visual.json"
      - name: Record source and candidate verification scope
        id: composition-mode
        shell: python
        env:
          OWNER_CI_INPUTS: ${{ inputs.owner_ci_inputs || '' }}
        run: |
          import json, os, pathlib
          feature_push = os.environ['GITHUB_EVENT_NAME'] == 'push' and os.environ['GITHUB_REF'].startswith('refs/heads/feature/')
          compose = not feature_push or bool(os.environ.get('OWNER_CI_INPUTS')) or pathlib.Path('.delivery/candidate-owner-ci.json').is_file()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('compose=' + str(compose).lower() + '\n')
          scope = {'source_revision': os.environ['GITHUB_SHA'], 'version': pathlib.Path('VERSION').read_text().strip(), 'source_only': not compose, 'composition_requested': compose}
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'source-scope.json').write_text(json.dumps(scope), encoding='utf-8')
          if not compose:
            print('Source/native verification only. Candidate composition and actual previous-release upgrade/rollback remain unverified until an explicit owner CI vector is supplied.')
      - name: Retain native visual traces even when a later release gate fails
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terminal-visual-${{ matrix.platform }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/*visual*.json
            ${{ runner.temp }}/*visual*-frames/**
            ${{ runner.temp }}/bootstrap-progress.json
            ${{ runner.temp }}/bootstrap-progress-frames/**
            ${{ runner.temp }}/progress-proof.json
            ${{ runner.temp }}/progress-proof-frames/**
            ${{ runner.temp }}/progress-parity.json
            ${{ runner.temp }}/progress-parity-lifecycle/**
            ${{ runner.temp }}/source-scope.json
          if-no-files-found: warn
      - name: Native runtime regression checks
        if: runner.os != 'Windows'
        shell: bash
        run: python -m unittest discover -s tests/macos -p test_runtime_rollback_preflight.py
      - name: Compose verified owner inputs and verify native payload
        if: steps.composition-mode.outputs.compose == 'true'
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          # Hosted Windows runners are elevated; real installs refuse elevation (ADR-0033).
          AXIOM_CLI_TEST_ALLOW_ELEVATED: '1'
          AXIOM_OWNER_CI_INPUTS: ${{ inputs.owner_ci_inputs || '' }}
          AXIOM_OWNER_CI_READ_TOKEN: ${{ secrets.AXIOM_OWNER_CI_READ_TOKEN }}
        run: |
          import os, pathlib, shutil, subprocess, sys
          import json, time
          version = pathlib.Path("VERSION").read_text().strip()
          candidate = os.environ.get('AXIOM_OWNER_CI_INPUTS', '')
          recorded = pathlib.Path('.delivery/candidate-owner-ci.json')
          if not candidate and recorded.is_file():
            candidate = recorded.read_text(encoding='utf-8')
          if candidate and not os.environ.get('AXIOM_OWNER_CI_READ_TOKEN'):
            raise SystemExit('Candidate verification needs AXIOM_OWNER_CI_READ_TOKEN with read-only Actions access to the three owner repositories; no owner was published.')
          deadline = time.monotonic() + 1800
          for repo in (() if candidate else ('axiom-graphd', 'axiom-mcp', 'axiom-skills')):
            while True:
              result = subprocess.run(['gh', 'release', 'view', 'v' + version, '--repo', 'orchex006/' + repo, '--json', 'isDraft'], capture_output=True, text=True)
              if result.returncode == 0 and json.loads(result.stdout)['isDraft'] is False:
                break
              assert time.monotonic() < deadline, 'verified owner Release unavailable: ' + repo
              print('Waiting for published v' + version + ' owner: ' + repo, flush=True)
              time.sleep(10)
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'distribution-assets'
          command = [sys.executable, 'release/compose_012.py', '--platform', '${{ matrix.platform }}', '--out', str(output), '--source-revision', os.environ['GITHUB_SHA']]
          if candidate:
            vector = pathlib.Path(os.environ['RUNNER_TEMP']) / 'candidate-owner-inputs.json'
            vector.write_text(json.dumps(json.loads(candidate)), encoding='utf-8')
            command.extend(['--owner-ci-inputs', str(vector)])
          env = dict(os.environ)
          if candidate:
            env['GH_TOKEN'] = os.environ['AXIOM_OWNER_CI_READ_TOKEN']
          subprocess.run(command, check=True, env=env)
          subprocess.run([sys.executable, 'release/verify_distribution.py', '--release', str(output / 'assembled'), '--out', str(output / 'native-proof.json')], check=True)
          shutil.copyfile(pathlib.Path(os.environ['RUNNER_TEMP']) / 'progress-parity.json', output / 'progress-parity.json')
      - uses: actions/upload-artifact@v4
        if: steps.composition-mode.outputs.compose == 'true'
        with:
          name: distribution-${{ matrix.platform }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/distribution-assets/*.zip
            ${{ runner.temp }}/distribution-assets/*.tar.gz
            ${{ runner.temp }}/distribution-assets/*-distribution.json
            ${{ runner.temp }}/distribution-assets/native-proof.json
            ${{ runner.temp }}/distribution-assets/progress-parity.json
          if-no-files-found: error
  oneliner:
    # ADR-0033 / L-007: the exact documented one-liner on a fresh hosted runner against the
    # candidate built above, then version, doctor (exit 0), update, uninstall and reinstall, plus
    # the ADR-0035 / L-013 update one-liner (installed, leftover variable, nothing installed, 0.1.2 layout).
    # ADR-0034 / M-001 owns the macOS Intel candidate lane separately from L.
    name: one-line install (${{ matrix.platform }})
    needs: [native, dependency-audit]
    if: needs.native.outputs.composed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2025
          - platform: linux-x64
            os: ubuntu-24.04
          - platform: macos-x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: distribution-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ runner.temp }}/candidate
      - name: Bootstrapper generator and update.sh behaviour tests
        shell: bash
        run: python -m unittest tests.test_bootstrappers -v
      - name: Documented install and update one-liners, version, doctor, update, uninstall, reinstall
        shell: bash
        run: python tests/l007_fresh_runner.py --artifacts "$RUNNER_TEMP/candidate" --platform ${{ matrix.platform }} --out "$RUNNER_TEMP/oneliner/oneliner-${{ matrix.platform }}.json"
      - name: Upgrade actual previous release and verify rollback
        shell: bash
        run: |
          python tests/upgrade_previous_release.py --artifacts "$RUNNER_TEMP/candidate" --platform ${{ matrix.platform }} --out "$RUNNER_TEMP/oneliner/previous-upgrade-${{ matrix.platform }}.json"
          python tests/upgrade_previous_release.py --previous 0.1.6 --artifacts "$RUNNER_TEMP/candidate" --platform ${{ matrix.platform }} --out "$RUNNER_TEMP/oneliner/legacy-upgrade-${{ matrix.platform }}.json"
      - name: Windows uninstall and retained-runtime recovery
        if: matrix.platform == 'windows-x64'
        shell: bash
        run: python tests/windows_runtime_reinstall.py --archive "$RUNNER_TEMP/candidate/axiom-$(cat VERSION)-windows-x64.zip" --out "$RUNNER_TEMP/oneliner/retained-runtime-repair.json"
      - name: Native Mac Intel bootstrap options and digest/network refusals
        if: matrix.platform == 'macos-x64'
        shell: bash
        run: |
          python tests/l004_posix_bootstrap.py --archive "$RUNNER_TEMP/candidate/axiom-$(cat VERSION)-macos-x64.tar.gz" --work "$RUNNER_TEMP/m001-boundaries" > "$RUNNER_TEMP/oneliner/m001-boundaries.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oneliner-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ runner.temp }}/oneliner/*.json
  published-macos:
    # M-001 AC1: the published embedded release through a real terminal on a clean account.
    # M-002 may consume this separate published proof after M-001 closes; candidate logs never qualify.
    name: published one-line install (macos-x64)
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Published bootstrapper, one confirmation and native lifecycle
        run: python tests/m001_published_oneliner.py --out "$RUNNER_TEMP/published/published-macos-x64.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-oneliner-macos-x64-${{ github.sha }}
          path: ${{ runner.temp }}/published/*.json
          if-no-files-found: error
