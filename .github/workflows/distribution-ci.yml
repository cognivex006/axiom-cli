name: Native 0.1.6 distribution CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  native:
    name: native (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2025
          - platform: linux-x64
            os: ubuntu-24.04
          - platform: macos-x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Public documentation and release-note checks
        shell: bash
        run: |
          python release/check_public_docs.py
          python -m unittest tests.test_public_docs -v
      - name: Required owner Rust checks
        shell: bash
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
          cargo +1.85.0 fmt --check
          cargo +1.85.0 clippy --locked --all-targets -- -D warnings
          cargo +1.85.0 test --locked
          cargo +1.85.0 build --locked --release
      - name: Native runtime regression checks
        if: runner.os != 'Windows'
        shell: bash
        run: python -m unittest discover -s tests/macos -p test_runtime_rollback_preflight.py
      - name: Compose actual published 0.1.6 owner bytes and verify native payload
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          # Hosted Windows runners are elevated; real installs refuse elevation (ADR-0033).
          AXIOM_CLI_TEST_ALLOW_ELEVATED: '1'
        run: |
          import os, pathlib, subprocess, sys
          import json, time
          deadline = time.monotonic() + 600
          for repo in ('axiom-graphd', 'axiom-mcp', 'axiom-skills'):
            while True:
              result = subprocess.run(['gh', 'release', 'view', 'v0.1.6', '--repo', 'orchex006/' + repo, '--json', 'isDraft'], capture_output=True, text=True)
              if result.returncode == 0 and json.loads(result.stdout)['isDraft'] is False:
                break
              assert time.monotonic() < deadline, 'verified owner Release unavailable: ' + repo
              print('Waiting for published v0.1.6 owner: ' + repo, flush=True)
              time.sleep(10)
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'distribution-assets'
          subprocess.run([sys.executable, 'release/compose_012.py', '--platform', '${{ matrix.platform }}', '--out', str(output), '--source-revision', os.environ['GITHUB_SHA']], check=True)
          subprocess.run([sys.executable, 'release/verify_distribution.py', '--release', str(output / 'assembled'), '--out', str(output / 'native-proof.json')], check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.platform }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/distribution-assets/*.zip
            ${{ runner.temp }}/distribution-assets/*.tar.gz
            ${{ runner.temp }}/distribution-assets/*-distribution.json
            ${{ runner.temp }}/distribution-assets/native-proof.json
          if-no-files-found: error
  oneliner:
    # ADR-0033 / L-007: the exact documented one-liner on a fresh hosted runner against the
    # candidate built above, then version, doctor (exit 0), update, uninstall and reinstall, plus
    # the ADR-0035 / L-013 update one-liner (installed, leftover variable, nothing installed, 0.1.2 layout).
    # ADR-0034 / M-001 owns the macOS Intel candidate lane separately from L.
    name: one-line install (${{ matrix.platform }})
    needs: native
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-2025
          - platform: linux-x64
            os: ubuntu-24.04
          - platform: macos-x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: distribution-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ runner.temp }}/candidate
      - name: Bootstrapper generator and update.sh behaviour tests
        shell: bash
        run: python -m unittest tests.test_bootstrappers -v
      - name: Documented install and update one-liners, version, doctor, update, uninstall, reinstall
        shell: bash
        run: python tests/l007_fresh_runner.py --artifacts "$RUNNER_TEMP/candidate" --platform ${{ matrix.platform }} --out "$RUNNER_TEMP/oneliner/oneliner-${{ matrix.platform }}.json"
      - name: Native Mac Intel bootstrap options and digest/network refusals
        if: matrix.platform == 'macos-x64'
        shell: bash
        run: |
          python tests/l004_posix_bootstrap.py --archive "$RUNNER_TEMP/candidate/axiom-0.1.6-macos-x64.tar.gz" --work "$RUNNER_TEMP/m001-boundaries" > "$RUNNER_TEMP/oneliner/m001-boundaries.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oneliner-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ runner.temp }}/oneliner/*.json
  published-macos:
    # M-001 AC1: the published embedded release through a real terminal on a clean account.
    # M-002 may consume this separate published proof after M-001 closes; candidate logs never qualify.
    name: published one-line install (macos-x64)
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Published bootstrapper, one confirmation and native lifecycle
        run: python tests/m001_published_oneliner.py --out "$RUNNER_TEMP/published/published-macos-x64.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-oneliner-macos-x64-${{ github.sha }}
          path: ${{ runner.temp }}/published/*.json
          if-no-files-found: error
