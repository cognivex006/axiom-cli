name: Native GitHub Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable version tag
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/distribution-ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: distribution-*-${{ github.sha }}
          path: checked-assets
      - name: Verify source and publish new immutable distribution
        env:
          GH_TOKEN: ${{ github.token }}
          # Hosted Windows runners are elevated; real installs refuse elevation (ADR-0033).
          AXIOM_CLI_TEST_ALLOW_ELEVATED: '1'
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python -c "import os,re; assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+',os.environ['RELEASE_TAG'])"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          test "$RELEASE_TAG" = "v$(cat VERSION | tr -d '\r\n')"
          python release/collect_distribution.py --input checked-assets --source-revision "$GITHUB_SHA" --out release-assets
          python release/oneline_assets.py --assets release-assets --tag "$RELEASE_TAG"
          python release/render_release_notes.py --tag "$RELEASE_TAG" --out "$RUNNER_TEMP/release-notes.md"
          python release/check_public_docs.py --assets release-assets --notes "$RUNNER_TEMP/release-notes.md"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Existing Release is immutable' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "Axiom $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
